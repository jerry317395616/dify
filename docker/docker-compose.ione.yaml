x-ione-public-api-urls: &ione-public-api-urls
  CONSOLE_API_URL: ${CONSOLE_API_URL:-}
  CONSOLE_WEB_URL: ${CONSOLE_WEB_URL:-}
  SERVICE_API_URL: ${SERVICE_API_URL:-}
  APP_API_URL: ${APP_API_URL:-}
  APP_WEB_URL: ${APP_WEB_URL:-}
  FILES_URL: ${FILES_URL:-}

services:
  api:
    image: ${IONE_DIFY_API_IMAGE:-ione/dify-api:local}
    environment:
      <<: *ione-public-api-urls
      FRAPPE_OAUTH_BASE_URL: ${FRAPPE_OAUTH_BASE_URL:-}
      FRAPPE_OAUTH_INTERNAL_BASE_URL: ${FRAPPE_OAUTH_INTERNAL_BASE_URL:-http://frontend:8080}
      FRAPPE_OAUTH_CLIENT_ID: ${FRAPPE_OAUTH_CLIENT_ID:-}
      FRAPPE_OAUTH_CLIENT_SECRET: ${FRAPPE_OAUTH_CLIENT_SECRET:-}
      FRAPPE_OAUTH_ALLOWED_ROLES: ${FRAPPE_OAUTH_ALLOWED_ROLES:-}
      FRAPPE_OAUTH_JIT_ENABLED: ${FRAPPE_OAUTH_JIT_ENABLED:-false}
      FRAPPE_OAUTH_JIT_TENANT_ID: ${FRAPPE_OAUTH_JIT_TENANT_ID:-}
      FRAPPE_OAUTH_JIT_TENANT_ROLE: ${FRAPPE_OAUTH_JIT_TENANT_ROLE:-normal}
      # Keep the branded deployment on its tenant-managed template catalog.
      HOSTED_FETCH_APP_TEMPLATES_MODE: ${HOSTED_FETCH_APP_TEMPLATES_MODE:-db}
    networks:
      - ione_qwen
      - frappe_internal

  api_websocket:
    image: ${IONE_DIFY_API_IMAGE:-ione/dify-api:local}
    environment: *ione-public-api-urls
    networks:
      - ione_qwen

  worker:
    image: ${IONE_DIFY_API_IMAGE:-ione/dify-api:local}
    environment: *ione-public-api-urls
    networks:
      - ione_qwen

  worker_beat:
    image: ${IONE_DIFY_API_IMAGE:-ione/dify-api:local}
    environment: *ione-public-api-urls
    networks:
      - ione_qwen

  web:
    image: ${IONE_DIFY_WEB_IMAGE:-ione/dify-web:local}
    environment:
      CONSOLE_WEB_URL: ${CONSOLE_WEB_URL:-}
      APP_WEB_URL: ${APP_WEB_URL:-}
      IONE_BRANDED_UI: ${IONE_BRANDED_UI:-true}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}

  # Dify's client and Weaviate must use the same key. The upstream Compose
  # exposes two independently configurable variables, which can silently drift
  # and make every knowledge-base indexing task fail with HTTP 401.
  weaviate:
    environment:
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih}

  plugin_daemon:
    networks:
      - ione_qwen

  agent_backend:
    image: ${IONE_DIFY_AGENT_IMAGE:-ione/dify-agent-backend:local}
    networks:
      - ione_qwen

networks:
  ione_qwen:
    name: ${IONE_QWEN_NETWORK:-ione-qwen-internal}
    external: true
  frappe_internal:
    name: ${IONE_FRAPPE_NETWORK:-frappe-unified_default}
    external: true
